name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Swift 6.1 is the supported floor; see docs/decisions.md#toolchain.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4 (Swift 6.1)
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - run: swift --version
      - run: swift build --build-tests
      - run: swift test
